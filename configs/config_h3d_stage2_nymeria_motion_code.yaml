NAME: MotionCode_Nymeria # Experiment names
ACCELERATOR: 'gpu' # Devices optioncal: “cpu”, “gpu”, “tpu”, “ipu”, “hpu”, “mps, “auto”
NUM_NODES: 1 # Number of GPU nodes for distributed training
DEVICE: [0] # Index of gpus eg. [0] or [0,1,2,3]

TRAIN:
  #---------------------------------
  STAGE: lm_pretrain # stage "vae" , "lm_pretrain", "lm_instruct"
  #---------------------------------
  NUM_WORKERS: 16 # Number of workers
  BATCH_SIZE: 1 # Size of batches
  END_EPOCH: 300 # End epoch
  RESUME: '' # Resume training from this path
  PRETRAINED: '/home/dominik/Documents/repos/MotionGPT/experiments/mgpt/Pretrain_Nymeria_2025-08-12-19-04-45/checkpoints/epoch=199-v1.ckpt' # Preatrained model path
  PRETRAINED_VAE: experiments/mgpt/VQVAE_NYMERIA_2025-08-15-19-14-25/checkpoints/epoch=2849-v1.ckpt

  OPTIM:
    target: AdamW
    params:
      lr: 2e-4
      betas: [0.9, 0.99]
      weight_decay: 0.0

# Evaluating Configuration
EVAL:
  BATCH_SIZE: 1 # Evaluating Batch size
  SPLIT: val # og code used to be test, seems odd, changed it to val

TEST:
  CHECKPOINTS: experiments/mgpt/VQVAE_NYMERIA_2025-08-15-19-14-25/checkpoints/epoch=2849-v1.ckpt
  SPLIT: test
  BATCH_SIZE: 1 # training Batch size

DATASET:
  target: mGPT.data.Nymeria.NymeriaDataModule
  CODE_PATH: TOKENS

METRIC:
  TYPE: ['PredMetrics']

LOSS:
  LAMBDA_FEATURE: 1.0
  LAMBDA_VELOCITY: 0.5
  LAMBDA_COMMIT: 0.02
  LAMBDA_CLS: 1.0
  ABLATION:
    RECONS_LOSS: 'l1_smooth'

model:
  target: mGPT.models.mgpt.MotionGPT
  params:
    condition: 'text'
    task: 't2m'
    lm: ${lm.default}
    motion_vae: ${vq.default}

LOGGER:
  TYPE: ['tensorboard', 'wandb']
  VAL_EVERY_STEPS: 10
  WANDB:
    params:
      project: motiongpt
